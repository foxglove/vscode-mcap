name: Validate extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: xvfb-run -a npm run test:integration
      - run: npm run package:local
      - uses: actions/upload-artifact@v4
        with:
          name: mcap-viewer
          path: "*.vsix"
