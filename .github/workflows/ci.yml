name: Validate extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        vscode: ["1.96.0", "stable"]
    runs-on: ubuntu-latest
    env:
      MCAP_TEST_VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: xvfb-run -a npm run test:integration
      - uses: actions/upload-artifact@v4
        with:
          name: foxglove-mcap-explorer-${{ matrix.vscode }}
          path: "*.vsix"
